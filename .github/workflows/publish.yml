name: publish

# Publishes to npm via Trusted Publishing (OIDC).
#
# No NPM_TOKEN secret is used, and none should be added. The workflow asks
# GitHub for a short-lived OIDC token, npm exchanges it for publish rights, and
# the registry verifies that the request really came from this workflow in this
# repository. Nothing long-lived is stored anywhere.
#
# Prerequisites on npmjs.com (package -> Settings -> Trusted publishing):
#   Provider    GitHub Actions
#   User        fgfg163
#   Repository  dsh-agentmemory-plugin
#   Workflow    publish.yml
#
# The *first* release of a package name has to go out by hand: npm only lets you
# configure a trusted publisher for a package that already exists. Every release
# after that can come from here.
#
# Trigger: publish a GitHub Release (deliberate, one click), or run this workflow
# manually. A bare `git push --tags` does not publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish --dry-run only, do not touch the registry
        type: boolean
        default: false

permissions:
  contents: read
  # Required for OIDC. Without this, npm cannot obtain an identity token and the
  # publish fails with a 403 asking for 2FA or a bypass-2FA token.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Node 24 already ships an npm that speaks OIDC, but the floor is pinned
      # explicitly so a runner image change cannot silently regress it.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          v=$(npm --version)
          echo "npm $v"
          node -e "
            const p = '$v'.split('.').map(Number);
            const ok = p[0] > 11 || (p[0] === 11 && (p[1] > 5 || (p[1] === 5 && p[2] >= 1)));
            if (!ok) {
              console.error('npm ' + p.join('.') + ' is below 11.5.1; OIDC trusted publishing needs >= 11.5.1');
              process.exit(1);
            }
          "

      # lib/index.js is a build artifact from an upstream bundle, patched in
      # place. These checks catch the case where someone edited it by hand, or
      # where a regeneration dropped one of the patches.
      - name: Verify the patched artifact
        run: |
          set -euo pipefail
          test -f lib/index.js

          # grep -c exits 1 when it matches nothing, though it still prints 0.
          # `|| true` keeps that 0 so the test below reports "found 0" instead of
          # the step dying on the grep itself.
          markers=$(grep -c 'PATCHED 2026-' lib/index.js || true)
          echo "PATCHED markers: $markers"
          test "$markers" -ge 2 || { echo "::error::expected at least 2 PATCHED markers, found $markers"; exit 1; }

          grep -q 'function contextMaxChars(config)' lib/index.js \
            || { echo "::error::contextMaxChars helper is missing"; exit 1; }

          callsites=$(grep -c 'contextMaxChars(config))' lib/index.js || true)
          echo "patched call sites: $callsites"
          test "$callsites" -eq 2 || { echo "::error::expected 2 patched call sites, found $callsites"; exit 1; }

          if grep -q 'sourceMappingURL' lib/index.js; then
            echo "::error::lib/index.js still carries a sourceMappingURL trailer pointing at a map this package does not ship"
            exit 1
          fi

          grep -q 'export { apply, name }' lib/index.js \
            || { echo "::error::plugin export shape changed"; exit 1; }

          # The artifact is published as-is; keep its size on record so a silent
          # truncation shows up in the log rather than in the registry.
          wc -c lib/index.js

          echo "artifact checks passed"

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package.json version $ver"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $ver"

      - name: Publish
        env:
          # Must be empty. setup-node writes an .npmrc pointing at this variable;
          # if it holds any value npm tries token auth first and never attempts
          # the OIDC exchange, ending in a 403.
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run requested, not touching the registry"
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi

      - name: Confirm what landed on the registry
        if: github.event_name == 'release' || inputs.dry_run != true
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          echo "waiting for $ver to appear on the registry"
          for i in $(seq 1 12); do
            if npm view "@fgfg163/dsh-agentmemory-plugin@$ver" version > /dev/null 2>&1; then
              echo "confirmed: $ver is live"
              npm view "@fgfg163/dsh-agentmemory-plugin@$ver" version dist.tarball dist.integrity
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ver did not show up on the registry within 60s"
          exit 1
