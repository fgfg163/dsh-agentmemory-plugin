# Bundle patch for @fgfg163/dsh-agentmemory-plugin.
#
# Mounts the row. That is ALL this file does now (2026-11-18).
#
# The plugin's settings live in <DSH_HOME>/storages/dsh-agentmemory-workspaces.json,
# beside every other section of DSH, so that a backup is one directory and the
# settings page is the only place values are edited. Putting them here instead
# would mean DSH's generated form owns the fields, which is what this replaced.
#
# A value left in this row still works: the plugin reads the store first, then
# the row, so an explicit YAML pin outranks the built-in default. Nothing is
# written back here.
- insert:
    - id: fgfg163-agentmemory-plugin
      name: '@fgfg163/dsh-agentmemory-plugin'
